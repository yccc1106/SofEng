version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: meetu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meetu
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: meetu_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

  ws-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meetu_ws
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - WS_PORT=8081
      - JWT_SECRET=${JWT_SECRET}
    restart: always

volumes:
  postgres_data:
  redis_data:
