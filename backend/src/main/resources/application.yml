spring:
  application:
    name: meetu-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meetu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 12h
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

mybatis:
  configuration:
    map-underscore-to-camel-case: true

meetu:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  trusted-proxy-address: ${TRUSTED_PROXY_ADDRESS:}
  trtc:
    sdk-app-id: ${TRTC_SDK_APP_ID:0}
    secret-key: ${TRTC_SECRET_KEY:}
    user-sig-expire-seconds: ${TRTC_USER_SIG_EXPIRE_SECONDS:86400}
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: MeetU Backend
    description: MeetU independent Java backend
